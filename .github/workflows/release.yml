name: Release

# Builds only when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0),
# never on ordinary commits. Manual runs build the exes as a downloadable artifact without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Keep the app version in sync with the tag, so v0.2.0 builds HERO68-Config-*-0.2.0.exe.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: hero68-config-windows
          path: dist/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
